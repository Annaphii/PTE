
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WFD Journey – Luyện PTE Listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8FE; --surface:#FFFFFF; --sky:#E1F0FC; --line:#CFE3F5;
  --ink:#1F3550; --muted:#6C85A0; --navy:#4A8FD4; --red:#E0566A;
  --gold:#F0A93B; --fern:#2E8B62; --fern-bg:#E3F5EC; --red-bg:#FDE7EA; --gold-bg:#FFF1DA;
  --lilac:#9CC8EE;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:linear-gradient(180deg,#EAF5FF 0%,#F5FAFF 40%,#EFF8F6 100%) fixed;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;color:var(--navy)}
.brand span{font-size:14px;color:var(--muted)}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.accent{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.accent button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.chip b{font-weight:700}
.streak{background:var(--gold-bg);border-color:var(--gold)}

/* journey */
.journey{background:linear-gradient(135deg,#FFFFFF 0%,#EEF7FF 60%,#EAF8F5 100%);box-shadow:0 8px 30px rgba(74,143,212,.12);border:1px solid var(--line);border-radius:18px;padding:22px 22px 14px;margin-bottom:16px}
.journey-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px}
.journey-head h2{font-size:30px;color:var(--navy)}
.journey-head h2 small{font-family:var(--sans);font-size:17px;color:var(--muted)}
.route{width:100%;height:auto;display:block;margin-top:6px}
.route .track{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.route .flown{fill:none;stroke:var(--navy);stroke-width:3.5;stroke-linecap:round}
.route .city{fill:var(--surface);stroke:var(--lilac);stroke-width:2.5}
.route .city.reached{fill:var(--navy);stroke:var(--navy)}
.route .city.next{fill:var(--gold-bg);stroke:var(--gold);stroke-width:3}
.route text{font-family:var(--sans);font-size:13px;font-weight:700;fill:var(--ink)}
.route text.sub{font-size:11px;font-weight:400;fill:var(--muted)}
.plane{transition:transform .9s ease}
@media (prefers-reduced-motion: reduce){.plane{transition:none}}

/* today */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-top b{font-size:15px}
.meter-top span{font-size:14px;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--sky);border-radius:6px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.meter.pass .bar i{background:var(--fern)}
.meter-bot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter-bot .ok{color:var(--fern);font-weight:700}
.meter-bot .no{color:var(--red);font-weight:700}
.rule{font-size:13px;color:var(--muted);margin:-8px 0 16px}

/* tabs & pills */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--red)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.pills .lbl{font-size:14px;color:var(--muted);margin-right:4px}
.pill{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;position:relative}
.pill.review::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pill.pass{background:var(--fern-bg);border-color:var(--fern);color:var(--fern)}
.pill.fail{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.pill.cur{outline:3px solid var(--navy);outline-offset:1px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:5px}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-head h3{font-size:22px}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sky);color:var(--navy)}
.tag.review{background:var(--gold-bg);color:#7A5600}
:root[data-theme="dark"] .tag.review{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.review{color:var(--gold)}}
.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sky);border-radius:14px;padding:12px;margin-bottom:14px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(74,143,212,.35);display:grid;place-items:center}
.play svg{width:22px;height:22px}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:var(--surface)}
.toggle .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.toggle[aria-pressed="true"] .dot{background:var(--red)}
.speed{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin-left:auto}
.speed button{border:0;background:transparent;padding:7px 11px;font-size:14px;font-weight:700;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--navy);color:#fff}
.status{font-size:14px;color:var(--muted);min-width:120px}
textarea.answer{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);resize:vertical;font-size:18px}
textarea.answer:focus{border-color:var(--navy);outline:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.btn{border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:14px;color:var(--muted)}
.result{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.score strong{font-family:var(--serif);font-size:38px;font-weight:400}
.score .ok{color:var(--fern)} .score .no{color:var(--red)}
.words{font-size:20px;line-height:1.9}
.w-ok{color:var(--fern);font-weight:700}
.w-miss{color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.w-extra{color:var(--muted);text-decoration:line-through}
.target{font-family:var(--serif);font-size:22px;line-height:1.5;margin:6px 0}
.breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.breakdown span{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--sky)}
.countdown{font-size:14px;font-weight:700;color:var(--navy)}
.hiw-text{font-size:21px;line-height:2.1;margin:4px 0 6px}
.hw{border:0;background:transparent;padding:2px 3px;border-radius:6px;font-size:inherit;line-height:1.3}
.hw:hover{background:var(--sky)}
.hw.sel{background:var(--gold-bg);box-shadow:inset 0 -3px 0 var(--gold)}
.hw.g-hit{background:var(--fern-bg);color:var(--fern);font-weight:700}
.hw.g-wrong{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.hw.g-missed{box-shadow:inset 0 -3px 0 var(--red)}
.orig{font-size:13px;color:var(--fern);font-weight:700;vertical-align:super;margin-left:2px}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec .live{width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.rec .live{animation:none}}
.heard{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:54px;font-size:18px}
.done-box{text-align:center;padding:26px 10px}
.done-box h3{font-size:26px;margin-bottom:12px}
.vi{font-size:17px;color:var(--muted);margin:8px 0 0;font-style:italic}

/* settings & footer */
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.settings select{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);max-width:320px}
.settings label{display:inline-flex;align-items:center;gap:6px}
.tip{font-size:13px;color:var(--muted);margin-top:6px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.link{border:0;background:none;color:var(--navy);text-decoration:underline;padding:4px}

/* login */
.login{max-width:440px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.login h1{font-size:34px;color:var(--navy);margin-bottom:6px}
.field{display:block;margin-top:16px}
.field span{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.field input:focus{border-color:var(--navy);outline:none}
.flags{display:flex;gap:6px;margin:14px 0 4px}
.flags i{height:5px;flex:1;border-radius:3px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,20,45,.45)}
dialog textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:13px;word-break:break-all}

/* teacher */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:880px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);background:var(--bg);position:sticky;top:0}
td .ok{color:var(--fern);font-weight:700} td .no{color:var(--red);font-weight:700}
details summary{cursor:pointer;color:var(--navy)}
.hist{font-size:13px;color:var(--muted);margin-top:6px}

@media (max-width:640px){
  .today{grid-template-columns:1fr}
  .journey-head h2{font-size:24px}
  .speed{margin-left:0}
  .panel{padding:16px}
  .words,.hiw-text{font-size:19px}
}
</style>
</head>

<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<script>const DATA = [{"id":1,"t":"Students have the options to live in college residences or apartments.","h":[["options","choices"],["residences","houses"]],"v":"Sinh viên có thể chọn sống trong ký túc xá của trường hoặc căn hộ."},{"id":2,"t":"Observers waited nervously and with bated breath for the concert.","h":[["nervously","anxiously"],["concert","performance"]],"v":"Khán giả hồi hộp nín thở chờ buổi hòa nhạc."},{"id":3,"t":"The application process may take longer than it's expected.","h":[["process","procedure"],["longer","further"]],"v":"Quá trình nộp hồ sơ có thể mất nhiều thời gian hơn dự kiến."},{"id":4,"t":"Artists, other than politicians, played their own roles as critics of the culture.","h":[["roles","parts"],["critics","judges"]],"v":"Các nghệ sĩ, khác với chính trị gia, tự đóng vai trò là nhà phê bình văn hóa."},{"id":5,"t":"We can't consider any increase in our price at this stage.","h":[["increase","change"],["stage","point"]],"v":"Chúng tôi không thể xem xét việc tăng giá ở giai đoạn này."},{"id":6,"t":"Our professor is hosting the business development conference.","h":[["hosting","holding"],["development","growth"]],"v":"Giáo sư của chúng tôi đang tổ chức hội nghị phát triển kinh doanh."},{"id":7,"t":"Animals raised in captivity behave differently than their wild counterparts.","h":[["captivity","confinement"],["wild","natural"]],"v":"Động vật được nuôi nhốt cư xử khác với đồng loại ngoài tự nhiên."},{"id":8,"t":"He has landed a job in a very prestigious law firm.","h":[["landed","found"],["prestigious","famous"]],"v":"Anh ấy đã có được việc làm ở một công ty luật rất danh tiếng."},{"id":9,"t":"Upgrading the manufacturing system can increase efficiency.","h":[["system","process"],["efficiency","productivity"]],"v":"Nâng cấp hệ thống sản xuất có thể tăng hiệu quả."},{"id":10,"t":"The commissioner will portion the funds among all the sovereignties.","h":[["portion","divide"],["funds","money"]],"v":"Ủy viên sẽ phân chia ngân quỹ cho tất cả các vùng lãnh thổ."},{"id":11,"t":"Please make sure you have collected all the necessary materials.","h":[["collected","gathered"],["necessary","required"]],"v":"Hãy chắc chắn rằng bạn đã thu thập đủ tài liệu cần thiết."},{"id":12,"t":"Organisational failure is considered in various perspectives in academic literature.","h":[["various","several"],["literature","writing"]],"v":"Sự thất bại của tổ chức được xem xét từ nhiều góc độ trong tài liệu học thuật."},{"id":13,"t":"The massive accumulation of data was converted into a communicable argument.","h":[["massive","huge"],["argument","message"]],"v":"Khối dữ liệu khổng lồ đã được chuyển thành một lập luận dễ truyền đạt."},{"id":14,"t":"We have a lecture in the morning on Thursday.","h":[["lecture","seminar"],["morning","evening"]],"v":"Chúng tôi có một bài giảng vào sáng thứ Năm."},{"id":15,"t":"All industries are a system of inputs, processes, outputs and feedback.","h":[["industries","companies"],["feedback","results"]],"v":"Mọi ngành công nghiệp đều là một hệ thống gồm đầu vào, quy trình, đầu ra và phản hồi."},{"id":16,"t":"Parents' talk to children tends to be simplified.","h":[["children","kids"],["simplified","shortened"]],"v":"Cách cha mẹ nói chuyện với con thường được đơn giản hóa."},{"id":17,"t":"Human beings compete with other species for space and resources.","h":[["compete","fight"],["resources","food"]],"v":"Con người cạnh tranh với các loài khác về không gian và tài nguyên."},{"id":18,"t":"The qualification will be assessed using a criterion-referenced approach.","h":[["qualification","degree"],["approach","method"]],"v":"Bằng cấp sẽ được đánh giá theo phương pháp dựa trên tiêu chí."},{"id":19,"t":"Statistic results should be expressed in different ways, depending on circumstances.","h":[["results","findings"],["circumstances","situations"]],"v":"Kết quả thống kê nên được trình bày theo nhiều cách khác nhau, tùy hoàn cảnh."},{"id":20,"t":"The key difference between courses is the kind of assessment.","h":[["diff article refers to a number of very interesting experiments.","h":[["refers","relates"],["interesting","important"]],"v":"Bài báo đề cập đến một số thí nghiệm rất thú vị."},{"id":206,"t":"Although sustainable development is not easy, it is an unavoidable responsibility.","h":[["sustainable","economic"],["unavoidable","shared"]],"v":"Dù phát triển bền vững không dễ, đó là trách nhiệm không thể né tránh."},{"id":207,"t":"Scientists were unsure when the early men first left Africa.","h":[["unsure","uncertain"],["left","departed"]],"v":"Các nhà khoa học không chắc khi nào người cổ đại lần đầu rời châu Phi."},{"id":208,"t":"Enrolling in a double major can provide you with better career opportunities.","h":[["double","joint"],["better","more"]],"v":"Học song ngành có thể mang lại cho bạn cơ hội nghề nghiệp tốt hơn."},{"id":209,"t":"You need to make sure that all your essays are handed in on time.","h":[["essays","assignments"],["time","schedule"]],"v":"Bạn cần đảm bảo mọi bài luận đều được nộp đúng hạn."},{"id":210,"t":"The commissioner will apportion the funds among other authorities.","h":[["apportion","distribute"],["authorities","departments"]],"v":"Ủy viên sẽ phân bổ ngân quỹ cho các cơ quan khác."},{"id":211,"t":"Having enough sleep has many positive benefits.","h":[["enough","adequate"],["positive","health"]],"v":"Ngủ đủ giấc có nhiều lợi ích tích cực."},{"id":212,"t":"The class is cancelled because the professor is sick.","h":[["cancelled","postponed"],["sick","away"]],"v":"Lớp học bị hủy vì giáo sư bị ốm."},{"id":213,"t":"The university library cafe is on the third floor.","h":[["cafe","shop"],["third","second"]],"v":"Quán cà phê của thư viện trường nằm ở tầng ba."},{"id":214,"t":"Universities offer a range of leisure amenities to their community.","h":[["leisure","sports"],["community","students"]],"v":"Các trường đại học cung cấp nhiều tiện ích giải trí cho cộng đồng."},{"id":215,"t":"Some students were absent due to the train delay.","h":[["absent","late"],["tr ucture"],["essays","reports"]],"v":"Trong lớp này giáo viên sẽ dạy bạn cách lên dàn ý bài luận."},{"id":226,"t":"You must call your doctor to make an appointment.","h":[["call","contact"],["appointment","arrangement"]],"v":"Bạn phải gọi cho bác sĩ để đặt lịch hẹn."},{"id":227,"t":"Universities should invest in new technologies designed for learning.","h":[["invest","spend"],["designed","made"]],"v":"Các trường đại học nên đầu tư vào công nghệ mới dành cho việc học."},{"id":228,"t":"A lack of formal education will limit your job opportunities.","h":[["lack","shortage"],["limit","affect"]],"v":"Thiếu giáo dục chính quy sẽ hạn chế cơ hội việc làm của bạn."},{"id":229,"t":"Journalists with qualifications often have many different job opportunities.","h":[["qualifications","experience"],["different","new"]],"v":"Nhà báo có bằng cấp thường có nhiều cơ hội việc làm khác nhau."}];</script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MEM = {};
const LS = {
  get(k, d){ if (k in MEM) return JSON.parse(MEM[k]); try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ MEM[k] = JSON.stringify(v); try { localStorage.setItem(k, MEM[k]); } catch(e){} }
};
const FRAMED = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
const PP = document.permissionsPolicy || document.featurePolicy;
const MIC_BLOCKED = FRAMED && PP && PP.allowsFeature && !PP.allowsFeature("microphone");
const openStandalone = () => window.open(location.href, "_blank", "noopener");
const BY = {}; DATA.forEach(s => BY[s.id] = s);
const IDS = DATA.map(s => s.id);
const TOTAL = IDS.length;
const PARTS = ["wfd","rs","hiw"];
const PNAME = {wfd:"Write From Dictation", rs:"Repeat Sentence", hiw:"Highlight Incorrect Words"};
const PSHORT = {wfd:"WFD", rs:"RS", hiw:"HIW"};
const INTERVALS = [1,2,4,7,14,30];
const PER_DAY = 10, REVIEW_MAX = 5;
const STOPS = [[20,"Hà Nội"],[40,"Hội An"],[60,"TP.HCM"],[80,"Sydney"],[100,"Melbourne"],[120,"Auckland"],[140,"Queenstown"],[160,"Vancouver"],[180,"Toronto"],[200,"London"],[TOTAL,"Oxford"]];

let prefs = Object.assign({accent:"GB", voice:"", speed:1, autoReplay:false, autoNext:true, chunk:true, autoRec:true}, LS.get("wfdj:prefs", {}));
prefs.accent = "GB";
function savePrefs(){ LS.set("wfdj:prefs", prefs); }
let user = LS.get("wfdj:user", null);
let st = null, tab = "wfd", idx = 0, view = user ? "student" : "login";
let hiwSel = new Set();
let nextTimer = null;

/* ---------- dates ---------- */
const dstr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => dstr(new Date());
function addDays(ds, n){ const [y,m,d] = ds.split("-").map(Number); return dstr(new Date(y, m-1, d+n)); }
const fmtMin = s => { const m = Math.round((s||0)/60); return m < 60 ? m+" phút" : Math.floor(m/60)+" giờ "+(m%60)+" phút"; };

/* ---------- student store ---------- */
const norm = s => s.trim().replace(/\s+/g," ").toLowerCase();
const skey = () => "wfdj:s:"+norm(user.name)+"|"+norm(user.cls);
function load(){ st = LS.get(skey(), null) || {cards:{}, days:{}}; ensureToday(); }
function save(){ LS.set(skey(), st); }
function ensureToday(){
  const d = today();
  if (st.days[d]) return st.days[d];
  const due = Object.keys(st.cards).map(Number).filter(id => BY[id] && st.cards[id].due <= d)
    .sort((a,b) => st.cards[a].due.localeCompare(st.cards[b].due) || st.cards[a].box - st.cards[b].box);
  const ids = due.slice(0, REVIEW_MAX);
  const review = ids.length;
  for (const id of IDS){ if (ids.length >= PER_DAY) break; if (!st.cards[id]) ids.push(id); }
  if (ids.length < PER_DAY){
    const rest = due.slice(REVIEW_MAX).concat(Object.keys(st.cards).map(Number).filter(id => BY[id])
      .sort((a,b) => st.cards[a].due.localeCompare(st.cards[b].due)));
    for (const id of rest){ if (ids.length >= PER_DAY) break; if (!ids.includes(id)) ids.push(id); }
  }
  st.days[d] = {ids, review, wfd:{}, rs:{}, hiw:{}, time:{wfd:0, rs:0, hiw:0}};
  save();
  return st.days[d];
}
const day = () => ensureToday();
const isReview = id => { const dd = day(); return dd.ids.indexOf(id) < dd.review; };
function schedule(id, pct){
  const c = st.cards[id] || {box:0, seen:0};
  c.seen++; c.last = pct;
  c.box = pct >= 80 ? Math.min(c.box+1, INTERVALS.length) : 1;
  c.due = addDays(today(), INTERVALS[c.box-1]);
  st.cards[id] = c;
}
function partStats(dd, p){
  const vals = dd.ids.map(id => dd[p][id]).filter(Boolean);
  const done = vals.length;
  const avg = done ? Math.round(vals.reduce((a,b) => a + b.pct, 0) / done) : 0;
  return {done, avg, total: dd.ids.length, pass: done === dd.ids.length && avg >= 80};
}
const dayPass = dd => PARTS.every(p => partStats(dd, p).pass);
function streak(){
  let n = 0, d = today();
  if (!(st.days[d] && dayPass(st.days[d]))) d = addDays(d, -1);
  while (st.days[d] && dayPass(st.days[d])){ n++; d = addDays(d, -1); }
  return n;
}
const covered = () => Object.values(st.cards).filter(c => c.seen > 0).length;
const mastered = () => Object.values(st.cards).filter(c => c.box >= 3).length;
function totalTime(){
  const t = {wfd:0, rs:0, hiw:0};
  Object.values(st.days).forEach(dd => PARTS.forEach(p => t[p] += (dd.time && dd.time[p]) || 0));
  return t;
}

/* ---------- text helpers ---------- */
const words = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\- ]+/g," ").split(/\s+/).map(w => w.replace(/^['-]+|['-]+$/g,"")).filter(Boolean);
function lcs(a, b){
  const n = a.length, m = b.length, dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hitA = new Set(), hitB = new Set(); let i = 0, j = 0;
  while (i < n && j < m){
    if (a[i] === b[j]){ hitA.add(i); hitB.add(j); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return {len: dp[0][0], hitA, hitB};
}
const BREAKS = new Set(["that","which","who","whose","where","when","because","although","while","if","but","in","on","at","for","with","by","from","during","before","after","between","across","without","through","than","depending","around","since","into","over","among","under","throughout"]);
function chunkText(t){
  const w = t.split(" ");
  if (w.length < 8) return t;
  const out = []; let last = 0, br = 0;
  for (let i = 0; i < w.length; i++){
    const lw = w[i].toLowerCase().replace(/[^a-z']/g,"");
    if (br < 2 && i - last >= 3 && w.length - i >= 3 && BREAKS.has(lw) && !/[,;:]$/.test(w[i-1])){
      out[out.length-1] += ","; last = i; br++;
    }
    out.push(w[i]);
  }
  return out.join(" ");
}
function hiwBuild(s){
  const toks = s.t.split(" "), out = toks.slice(), changed = [], orig = {};
  for (const [o, w] of s.h){
    const i = out.findIndex((t, k) => !changed.includes(k) && t.replace(/[^A-Za-z'-]/g,"").toLowerCase() === o.toLowerCase());
    if (i < 0) continue;
    const core = out[i].replace(/[^A-Za-z'-]/g,"");
    const rep = /^[A-Z]/.test(core) ? w[0].toUpperCase() + w.slice(1) : w;
    orig[i] = core; out[i] = out[i].replace(core, rep); changed.push(i);
  }
  return {out, changed, orig};
}

/* ---------- speech synthesis ---------- */
const TTS = "speechSynthesis" in window;
let voices = [];
function rankVoice(v){
  let s = 0; const n = v.name;
  if (/natural|neural/i.test(n)) s += 60;
  if (/online/i.test(n)) s += 30;
  if (/premium|enhanced|siri/i.test(n)) s += 45;
  if (/google/i.test(n)) s += 25;
  if (v.localService === false) s += 5;
  if (/compact|eloquence|novelty|bad news|bubbles|jester|whisper|zarvox|trinoids|albert|bells|boing|cellos|organ/i.test(n)) s -= 80;
  return s;
}
const langOf = v => (v.lang || "").replace("_","-").toLowerCase();
function accentVoices(){
  const want = "en-" + prefs.accent.toLowerCase();
  return voices.filter(v => langOf(v) === want || (prefs.accent === "GB" && langOf(v) === "en-uk")).sort((a,b) => rankVoice(b) - rankVoice(a));
}
function pickVoice(){
  const vs = accentVoices();
  return vs.find(v => v.name === prefs.voice) || vs[0] ||
    voices.filter(v => langOf(v).startsWith("en")).sort((a,b) => rankVoice(b) - rankVoice(a))[0] || null;
}
function loadVoices(){ if (!TTS) return; voices = speechSynthesis.getVoices(); const box = $("#voiceBox"); if (box) box.innerHTML = voiceBoxHTML(); }
if (TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

const P = {gen:0, timer:null, playing:false, waiting:false};
function setPlaying(on, msg){
  P.playing = on;
  const b = $("#playBtn"); if (b){ b.innerHTML = on ? ICON.stop : ICON.play; b.setAttribute("aria-label", on ? "Dừng" : "Phát câu"); }
  setStatus(msg !== undefined ? msg : (on ? "Đang đọc…" : ""));
}
function setStatus(m){ const s = $("#status"); if (s) s.textContent = m; }
function stopAudio(){
  P.gen++; clearTimeout(P.timer); P.waiting = false;
  if (TTS){ try { speechSynthesis.cancel(); } catch(e){} }
  setPlaying(false);
}
function play(text, onDone){
  if (!TTS){ setStatus("Trình duyệt không hỗ trợ đọc câu"); return; }
  stopAudio();
  const g = P.gen;
  const run = () => {
    if (g !== P.gen) return;
    const u = new SpeechSynthesisUtterance(prefs.chunk ? chunkText(text) : text);
    const v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.rate = prefs.speed; u.pitch = 1;
    u.onend = () => {
      if (g !== P.gen) return;
      if (prefs.autoReplay && !locked()){
        setPlaying(false, "Đọc lại sau 2 giây…");
        P.waiting = true;
        P.timer = setTimeout(() => { P.waiting = false; run(); }, 2000);
      } else { setPlaying(false); if (onDone) onDone(); }
    };
    u.onerror = () => { if (g === P.gen) setPlaying(false); };
    setPlaying(true);
    try { speechSynthesis.resume(); } catch(e){}
    speechSynthesis.speak(u);
  };
  P.timer = setTimeout(run, 80);
}
const curId = () => day().ids[idx];
const locked = () => !!day()[tab][curId()] || !!rec;
function togglePlay(){
  if (P.playing || P.waiting){ stopAudio(); return; }
  playCurrent();
}
function playCurrent(){
  const id = curId();
  play(BY[id].t, () => { if (tab === "rs" && prefs.autoRec && !MIC_BLOCKED && !day().rs[id]) setTimeout(() => { if (curId() === id && tab === "rs" && !rec) startRec(); }, 500); });
}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = "", recErr = "", silT = null;
function startRec(){
  if (!SR){ recErr = "unsupported"; renderPanel(); return; }
  stopAudio(); heard = ""; recErr = "";
  const id = curId();
  try {
    rec = new SR();
    rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    clearTimeout(silT); silT = setTimeout(stopRec, 8000);
    rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript + " "; heard = t.trim(); const h = $("#heard"); if (h) h.textContent = heard; clearTimeout(silT); silT = setTimeout(stopRec, 3000); };
    rec.onerror = e => { recErr = e.error || "error"; };
    rec.onend = () => {
      clearTimeout(silT);
      rec = null;
      if (curId() !== id || tab !== "rs"){ return; }
      if (heard) gradeRS(heard); else renderPanel();
    };
    rec.start();
  } catch(e){ rec = null; recErr = (e && e.name) || "error"; }
  renderPanel();
}
function stopRec(){ if (rec){ try { rec.stop(); } catch(e){} } }
function abortRec(){ if (rec){ const r = rec; rec = null; try { r.abort(); } catch(e){} } }

/* ---------- grading ---------- */
function afterGrade(){
  save(); renderSummary(); renderPills(); renderPanel();
  if (prefs.autoNext) startCountdown();
}
function gradeWFD(ans){
  const id = curId(), tw = words(BY[id].t), aw = words(ans);
  const bag = {}; aw.forEach(w => bag[w] = (bag[w]||0) + 1);
  let hit = 0; tw.forEach(w => { if (bag[w] > 0){ bag[w]--; hit++; } });
  const pct = Math.round(hit / tw.length * 100);
  const dd = day();
  if (!dd.wfd[id]) schedule(id, pct);
  dd.wfd[id] = {pct, ans};
  stopAudio(); afterGrade();
}
function gradeRS(text){
  const id = curId(), tw = words(BY[id].t), hw = words(text);
  const r = lcs(tw, hw);
  const hits = r.len, wrong = hw.length - hits, miss = tw.length - hits;
  const score = hits - wrong;
  const pct = Math.min(100, Math.round(Math.max(0, score) / 3 * 100));
  day().rs[id] = {pct, heard:text, hits, wrong, miss, score};
  afterGrade();
}
function gradeHIW(){
  const id = curId(), b = hiwBuild(BY[id]);
  const picks = [...hiwSel];
  const hit = picks.filter(i => b.changed.includes(i)).length, wrong = picks.length - hit;
  const pct = Math.max(0, Math.round((hit - wrong) / b.changed.length * 100));
  day().hiw[id] = {pct, picks, hit, wrong, score: hit - wrong, max: b.changed.length};
  stopAudio(); afterGrade();
}
function retry(){
  const dd = day(); delete dd[tab][curId()]; hiwSel = new Set(); heard = ""; recErr = "";

function goNext(auto){

}

function routeSVG(frac){

  const d = "M 30 105 C 130 55, 200 55, 300 105 S 470 155, 570 105 S 770 55, 870 105";

  </svg>`;
}
function placeRoute(frac){
  const trk = $("#trk"); if (!trk) return;
  const L = trk.getTotalLength();
  const f = $("#flown"); f.style.strokeDasharray = L; f.style.strokeDashoffset = L * (1 - frac);
  const cov = Math.round(frac*TOTAL);
  const nextIdx = STOPS.findIndex(x => x[0] > cov);
  $("#cities").innerHTML = STOPS.map(([n,name],k) => {
    const p = trk.getPointAtLength(L*Math.min(n/TOTAL,1));
    const up = k % 2 === 1;
    const ty = up ? p.y - 30 : p.y + 26;
    const cls = cov >= n ? "reached" : k === nextIdx ? "next" : "";
    return `<circle class="city ${cls}" cx="${p.x}" cy="${p.y}" r="${k===nextIdx?8:6.5}"/>
      <text x="${p.x}" y="${ty}" text-anchor="middle">${name}</text>
      <text class="sub" x="${p.x}" y="${ty+14}" text-anchor="middle">${n} câu</text>`;
  }).join("");
  const at = Math.min(L*frac, L-0.01), p = trk.getPointAtLength(at), q = trk.getPointAtLength(Math.min(at+1, L));
  const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
  $("#plane").style.transform = `translate(${p.x}px, ${p.y}px) rotate(${ang}deg)`;
}

function packState(){
  const td = today();
  const cards = Object.entries(st.cards).map(([id,c]) => [+id, c.box, c.seen, c.due, c.last]);
  const days = Object.keys(st.days).sort().slice(-60).map(d => {
    const dd = st.days[d];
    const part = p => d === td ? dd[p] : Object.fromEntries(Object.entries(dd[p]).map(([k,v]) => [k, {pct:v.pct}]));
    return [d, dd.ids, dd.review, part("wfd"), part("rs"), part("hiw"), dd.time];
  });
  return {v:1, n:user.name, c:user.cls, cards, days};
}
function unpackState(o){
  const s = {cards:{}, days:{}};
  o.cards.forEach(([id,box,seen,due,last]) => s.cards[id] = {box, seen, due, last});
  o.days.forEach(([d,ids,review,wfd,rs,hiw,time]) => s.days[d] = {ids, review, wfd, rs, hiw, time: time || {wfd:0,rs:0,hiw:0}});
  return s;
}
function openMove(){
  const code = "PTES." + b64e(JSON.stringify(packState()));
  const dlg = $("#dlg");
  dlg.innerHTML = `<h3 style="font-size:22px;margin-bottom:8px">Mã chuyển máy</h3>
    <p class="hint">Trên máy mới: Đổi học viên → Nhập mã chuyển máy.</p>
    <textarea readonly id="codeBox">${esc(code)}</textarea>
    <div class="actions"><button class="btn" id="copyBtn">Sao chép</button><button class="btn ghost" id="closeDlg">Đóng</button><span class="hint" id="copyMsg"></span></div>`;
  dlg.showModal();
  bindCopy(code);
}
function bindCopy(code){
  $("#closeDlg").onclick = () => $("#dlg").close();
  $("#copyBtn").onclick = async () => {
    const box = $("#codeBox"); box.focus(); box.select();
    let ok = false;
    try { await navigator.clipboard.writeText(code); ok = true; } catch(e){ try { ok = document.execCommand("copy"); } catch(_){} }
    $("#copyMsg").textContent = ok ? "Đã sao chép" : "Bôi đen rồi Ctrl/Cmd + C";
  };
}

/* ---------- teacher ---------- */
let tFilter = "";
function renderTeacher(){
  const T = LS.get("wfdj:teacher", {students:{}});
  const list = Object.values(T.students);
  const classes = [...new Set(list.map(s => s.c))].sort();
  const rows = list.filter(s => !tFilter || s.c === tFilter).sort((a,b) => a.c.localeCompare(b.c) || a.n.localeCompare(b.n));
  const td = today();
  const cell = (s, p) => {
    const last = s.days[s.days.length-1];
    if (!last || last.d !== td) return `<span class="muted">chưa làm</span>`;
    const [done, avg, total] = last[p];
    return `${done}/${total} · <span class="${avg>=80?"ok":"no"}">${done?avg+"%":"–"}</span>`;
  };
  $("#app").innerHTML = `
  <header class="top">
    <div class="brand"><h1>Học viên</h1></div>
    <div class="top-right"><button class="btn ghost" id="back">Quay lại</button></div>
  </header>
  <section class="panel" style="margin-bottom:16px">
    <h3 style="font-size:20px;margin-bottom:6px">Dán mã báo cáo</h3>
    <textarea class="answer" id="codes" style="font-size:14px;min-height:80px" placeholder="PTE1.…"></textarea>
    <div class="actions"><button class="btn" id="addCodes">Thêm</button><span class="hint" id="addMsg"></span></div>
  </section>
  <div class="actions" style="margin-bottom:10px">
    <label class="hint">Lớp <select id="clsSel" style="border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)">
      <option value="">Tất cả</option>${classes.map(c => `<option ${c===tFilter?"selected":""}>${esc(c)}</option>`).join("")}
    </select></label>
    <span class="hint">${rows.length} học viên</span>
  </div>
  ${rows.length ? `<div class="tscroll"><table>
    <thead><tr><th>Học viên</th><th>Câu WFD đã học</th><th>Hôm nay WFD</th><th>Hôm nay RS</th><th>Hôm nay HIW</th><th>Đạt hôm nay</th><th>Tổng thời gian</th><th>Chuỗi</th><th>Cập nhật</th></tr></thead>
    <tbody>${rows.map(s => {
      const last = s.days[s.days.length-1];
      const passToday = last && last.d === td && PARTS.every(p => last[p][0] === last[p][2] && last[p][1] >= 80);
      const hist = s.days.slice().reverse().slice(0,14).map(d => {
        const ok = PARTS.every(p => d[p][0] === d[p][2] && d[p][1] >= 80);
        return `${d.d}: ${PARTS.map((p,i) => `${PSHORT[p]} ${d[p][0]}/${d[p][2]} ${d[p][0]?d[p][1]+"%":"–"} (${fmtMin(d.t[i])})`).join(", ")} ${ok?"✓":""}`;
      }).join("<br>");
      return `<tr>
        <td><b>${esc(s.n)}</b><br><span class="muted">${esc(s.c)}</span></td>
        <td>${s.cov}/${s.tot}<br><span class="muted">thuộc ${s.mas}</span></td>
        <td>${cell(s,"wfd")}</td><td>${cell(s,"rs")}</td><td>${cell(s,"hiw")}</td>
        <td>${last && last.d === td ? (passToday ? '<span class="ok">Đạt</span>' : '<span class="no">Chưa đạt</span>') : '<span class="muted">–</span>'}</td>
        <td>WFD ${fmtMin(s.tt[0])}<br>RS ${fmtMin(s.tt[1])}<br>HIW ${fmtMin(s.tt[2])}</td>
        <td>${s.stk} ngày</td>
        <td>${new Date(s.at).toLocaleString("vi-VN")}<details><summary>Lịch sử</summary><div class="hist">${hist}</div></details><button class="link" data-del="${esc(s.c+"|"+s.n)}">Xoá</button></td>
      </tr>`; }).join("")}</tbody></table></div>`
  : ""}`;
  $("#back").onclick = () => { view = user ? "student" : "login"; render(); };
  $("#clsSel").onchange = e => { tFilter = e.target.value; renderTeacher(); };
  $("#addCodes").onclick = () => {
    const txt = $("#codes").value; const found = txt.match(/PTE1\.[A-Za-z0-9+/=]+/g) || [];
    let n = 0;
    for (const c of found){
      try {
        const r = JSON.parse(b64d(c.slice(5)));
        if (!r.n || !r.c || !Array.isArray(r.days)) continue;
        const k = r.c.trim().toLowerCase() + "|" + r.n.trim().toLowerCase();
        const old = T.students[k];
        if (!old || old.at <= r.at){ T.students[k] = r; n++; }
      } catch(e){}
    }
    LS.set("wfdj:teacher", T);
    renderTeacher();
    $("#addMsg").textContent = found.length ? `Đã thêm ${n}` : "Mã không hợp lệ";
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const [c, ...rest] = b.dataset.del.split("|"); const k = c.trim().toLowerCase()+"|"+rest.join("|").trim().toLowerCase();
    if (confirm("Xoá báo cáo này khỏi máy của bạn?")){ delete T.students[k]; LS.set("wfdj:teacher", T); renderTeacher(); }
  });
}

/* ---------- boot ---------- */
function render(){
  if (view === "login") renderLogin();
  else if (view === "teacher") renderTeacher();
  else renderStudent();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) stopAudio(); });
render();
})();
</script>
</body>
</html>
